[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksplots"
version = "0.1.0"
description = "Figure generation for the KS tumor microenvironment manuscript."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyreadr>=0.5",
    "openpyxl>=3.1",
    "scanpy>=1.10",
    "anndata>=0.10",
    "networkx>=3.2",
    "upsetplot>=0.9",
    "logomaker>=0.8",
    "plotly>=5.20",
    "scikit-bio>=0.6",
]

[project.scripts]
ksplots = "ksplots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
